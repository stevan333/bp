<p> Bačka Palanka je gradsko naselje u Srbiji i sedište istoimene opštine u Južnobačkom upravnom okrugu. Prema popisu iz 2022. bilo je 25.476 stanovnika. Nalazi se na zapadu Vojvodine, u blizini granice sa Hrvatskom. </p>
